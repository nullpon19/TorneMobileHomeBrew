name: tmhb
description: "torne mobile HomeBrew edition - a homebrew client for nasne (official firmware)."
publish_to: 'none'
version: 1.5.0+47

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  material_ui: ^1.11.0
  http: ^1.6.0
  xml: ^7.1.0
  crypto: ^3.0.8
  flutter_riverpod: ^3.5.0
  path_provider: ^2.1.6
  # Phase 5 (plan 26): DTCP-IP playback.
  pointycastle: ^4.0.0
  flutter_secure_storage: ^10.3.0
  file_picker: ^10.3.10
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  # Sleep suppression during playback (plan 32) is a hand-rolled
  # platform channel since plan 35 — no package dependency.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: LINESeedJP
      fonts:
        - asset: assets/fonts/LINESeedJP-Regular.ttf
    - family: KosugiMaru
      fonts:
        - asset: assets/fonts/KosugiMaru-Regular.ttf

# App icon generation (dart run flutter_launcher_icons).
# Source art: assets/icon/app_icon_source.webp; the 1024 PNG is the
# same art with its white corners filled in the background indigo
# (#211753) so the icon is full-bleed with no alpha.
flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/icon/app_icon_1024.png"
  image_path: "assets/icon/app_icon_1024.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#211753"
  adaptive_icon_foreground: "assets/icon/app_icon_1024.png"

# Vendored media_kit native-library packages (third_party/) replace the
# hosted ones so the app can ship custom libmpv binaries with ARIB
# caption decoding (libaribb24). See tool/libmpv/README.md and plan §55.
dependency_overrides:
  media_kit_libs_android_video:
    path: third_party/media_kit_libs_android_video
  media_kit_libs_ios_video:
    path: third_party/media_kit_libs_ios_video
  media_kit_libs_macos_video:
    path: third_party/media_kit_libs_macos_video
  media_kit_libs_windows_video:
    path: third_party/media_kit_libs_windows_video
